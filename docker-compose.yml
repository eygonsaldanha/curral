services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: curral
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - curral_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curral"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  curral_pgdata:
